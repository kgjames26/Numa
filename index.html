<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283b"><link rel="manifest" href="/manifest.webmanifest"><title>Numa — Budget en clair</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#142c3c;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px}input,select{width:100%;padding:11px;border:1px solid #d6e1e4;border-radius:10px;background:white}label{display:block;font-size:13px;color:#506571;margin:10px 0}.wrap{max-width:1100px;margin:auto;padding:28px 20px}.top{background:#10283b;color:white;padding:20px 0}.top .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:0;padding-bottom:0}.logo{font-size:28px;font-weight:800;letter-spacing:-1px}.logo i{color:#56e3bd;font-style:normal}.eyebrow{color:#5a7a86;font-size:12px;letter-spacing:2px;font-weight:700}h1{font-size:34px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0 0 12px}.muted{color:#647a85}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:white;border:1px solid #e0e9eb;border-radius:20px;padding:22px;box-shadow:0 6px 24px #17334708}.card.dark{background:#143247;color:white}.card strong{display:block;font-size:29px;margin-top:12px;letter-spacing:-1px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #e7eff0}.row:last-child{border:0}.btn{background:#163c4a;color:white}.light{background:#e7f4f1;color:#145547}.danger{color:#aa3446;background:#fff0f1}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}.tabs button.active{background:#163c4a;color:white}.tabs button{background:white}.fields{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}.fields label{margin:0}.wizard{max-width:620px;margin:65px auto}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.choice{border:2px solid #e0e9eb;background:white;text-align:left;min-height:92px}.choice.active{border-color:#1dbb9b;background:#ecfaf6}.choice small{display:block;color:#647a85;margin-top:7px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.hint{font-size:13px;color:#6b8089}.negative{color:#bd3f50}.positive{color:#00876c}@media(max-width:700px){.grid,.two,.choices{grid-template-columns:1fr}.fields{grid-template-columns:1fr 1fr}.fields label:first-child{grid-column:1/-1}.wrap{padding:20px 14px}h1{font-size:27px}.card strong{font-size:25px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s), euro=n=>new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'}).format(Number(n)||0),id=()=>Math.random().toString(36).slice(2),defaultData=()=>({configured:false,step:1,situation:'couple',mode:'shared',goal:'balance',split:'equal',people:[{id:id(),name:'Personne 1',income:0,personal:0},{id:id(),name:'Personne 2',income:0,personal:0}],expenses:[],history:[]});let data;try{data=JSON.parse(localStorage.getItem('numa-data'))||defaultData()}catch{data=defaultData()}let tab='home';const save=()=>{localStorage.setItem('numa-data',JSON.stringify(data));render()},monthly=e=>(+e.amount||0)*({monthly:1,yearly:1/12,quarterly:1/3,weekly:52/12}[e.period]||1),total=()=>data.expenses.reduce((s,e)=>s+monthly(e),0),income=()=>data.people.reduce((s,p)=>s+(+p.income||0),0),personal=()=>data.people.reduce((s,p)=>s+(+p.personal||0),0),share=p=>data.people.length===1?total():data.mode==='shared'?total()/data.people.length:data.split==='income'&&income()>0?total()*(+p.income||0)/income():total()/data.people.length,available=p=>data.mode==='shared'&&data.people.length>1?(income()-total()-personal())/data.people.length:(+p.income||0)-share(p)-(+p.personal||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),field=(name,val,fn,type='text')=>'<label>'+name+'<input type="'+type+'" value="'+esc(val)+'" onchange="'+fn+'"></label>',select=(name,val,options,fn)=>'<label>'+name+'<select onchange="'+fn+'">'+options.map(([v,t])=>'<option value="'+v+'" '+(val===v?'selected':'')+'>'+t+'</option>').join('')+'</select></label>',opts=(a,selected,fn)=>a.map(([v,title,sub])=>'<button class="choice '+(selected===v?'active':'')+'" onclick="'+fn+"('"+v+"')"+'"><b>'+title+'</b><small>'+sub+'</small></button>').join(''),change=(key,value)=>{data[key]=value;save()},person=(i,key,v)=>{data.people[i][key]=key==='name'?v:Number(v);save()},expense=(i,key,v)=>{data.expenses[i][key]=key==='amount'?Number(v):v;save()},historyChange=(i,key,v)=>{data.history[i][key]=key==='balance'?Number(v):v;save()};
function situation(v){data.situation=v;data.people=v==='single'?[data.people[0]]:data.people.length>1?data.people:[...data.people,{id:id(),name:'Personne 2',income:0,personal:0}];if(v==='single')data.mode='separate';save()}
function wizard(){return '<div class="wizard card"><div class="eyebrow">NUMA · CONFIGURATION</div><p class="muted">Étape '+data.step+' sur 3</p><h1>'+(data.step===1?'Votre situation':data.step===2?'Comment gérez-vous votre argent ?':'Votre priorité')+'</h1>'+(data.step===1?'<div class="choices">'+opts([['single','Je vis seul(e)','Budget individuel'],['couple','Nous sommes en couple','Budget à deux']],data.situation,'situation')+'</div>':data.step===2?data.situation==='single'?'<p>Votre budget sera individuel.</p>':'<div class="choices">'+opts([['shared','Revenus mutualisés','Tous les revenus sont mis en commun'],['separate','Revenus séparés','Chacun conserve son salaire']],data.mode,"v=>change('mode',v)")+'</div>':'<div class="choices">'+opts([['balance','Équilibrer mon budget','Comprendre les dépenses'],['save','Épargner davantage','Mettre de côté'],['project','Financer un projet','Prévoir les dépenses'],['debt','Rembourser les dettes','Suivre les remboursements']],data.goal,"v=>change('goal',v)")+'</div>')+'<div class="actions">'+(data.step>1?'<button onclick="data.step--;save()">Retour</button>':'')+'<button class="btn" onclick="if(data.step<3)data.step++;else data.configured=true;save()">'+(data.step===3?'Ouvrir mon budget':'Continuer')+'</button></div><p class="hint">Tout reste modifiable dans les paramètres. Vos données sont enregistrées sur cet appareil.</p></div>'}
function home(){return '<div class="grid"><div class="card dark">Revenus mensuels<strong>'+euro(income())+'</strong></div><div class="card">Charges mensuelles<strong>'+euro(total())+'</strong></div><div class="card">Reste disponible<strong>'+euro(income()-total()-personal())+'</strong></div></div><div class="two"><section class="card"><h2>Répartition du budget</h2><p class="hint">'+(data.mode==='shared'&&data.people.length>1?'Les revenus sont mutualisés et le solde après dépenses personnelles est partagé également.':'Chacun conserve son revenu et contribue aux charges.')+'</p>'+data.people.map(p=>'<div class="row"><span><b>'+esc(p.name)+'</b><br><small>Revenu '+euro(p.income)+'</small></span><span>Charges : '+euro(share(p))+'<br><b>Disponible : '+euro(available(p))+'</b></span></div>').join('')+'</section><section class="card"><h2>Répartition par catégorie</h2>'+Object.entries(data.expenses.reduce((a,e)=>(a[e.category]=(a[e.category]||0)+monthly(e),a),{})).map(([c,v])=>'<div class="row"><span>'+esc(c)+'</span><b>'+euro(v)+'</b></div>').join('')+'<p class="hint">Les montants annuels et trimestriels sont convertis automatiquement en provisions mensuelles.</p></section></div>'}
function expenses(){return '<section class="card"><h2>Dépenses et provisions</h2><p class="hint">Ajoutez, supprimez et modifiez chaque coût.</p>'+data.expenses.map((e,i)=>'<div class="row" style="display:block"><div class="fields">'+field('Dépense',e.name,"expense("+i+",'name',this.value)")+field('Montant €',e.amount,"expense("+i+",'amount',this.value)",'number')+select('Périodicité',e.period,[['monthly','Mensuelle'],['yearly','Annuelle'],['quarterly','Trimestrielle'],['weekly','Hebdomadaire']],"expense("+i+",'period',this.value)")+field('Catégorie',e.category,"expense("+i+",'category',this.value)")+'<button class="danger" onclick="data.expenses.splice('+i+',1);save()">Supprimer</button></div><p class="hint">Équivalent mensuel : '+euro(monthly(e))+'</p></div>').join('')+'<div class="actions"><button class="btn" onclick="data.expenses.push({id:id(),name:\'Nouvelle dépense\',amount:0,period:\'monthly\',category:\'Autres\'});save()">+ Ajouter une dépense</button></div><h2 style="margin-top:25px">Total : '+euro(total())+' / mois</h2></section>'}
function settings(){return '<div class="two"><section class="card"><h2>Votre foyer</h2>'+select('Situation',data.situation,[['single','Célibataire'],['couple','Couple']],"situation(this.value)")+(data.situation==='couple'?select('Gestion des revenus',data.mode,[['shared','Revenus mutualisés'],['separate','Revenus séparés']],"change('mode',this.value)"):'')+(data.situation==='couple'&&data.mode==='separate'?select('Répartition',data.split,[['equal','50 / 50'],['income','Proportionnelle aux revenus']],"change('split',this.value)"):'')+data.people.map((p,i)=>'<div class="row" style="display:block">'+field('Nom',p.name,"person("+i+",'name',this.value)")+field('Salaire mensuel €',p.income,"person("+i+",'income',this.value)",'number')+field('Dépenses personnelles €',p.personal,"person("+i+",'personal',this.value)",'number')+'</div>').join('')+'</section><section class="card"><h2>Préférences et données</h2>'+select('Objectif',data.goal,[['balance','Équilibrer le budget'],['save','Épargner'],['project','Projet'],['debt','Dettes']],"change('goal',this.value)")+'<div class="actions"><button class="btn" onclick="backup()">Exporter JSON</button><label>Importer JSON<input type="file" accept=".json" onchange="restore(this)"></label></div><p class="hint">Les données sont locales. Exportez une sauvegarde avant de changer de téléphone ou de navigateur.</p><button class="danger" onclick="if(confirm('Effacer toutes les données ?')){data=defaultData();save()}">Réinitialiser</button></section></div>'}
function history(){let h=[...data.history].sort((a,b)=>a.date.localeCompare(b.date));return '<section class="card"><h2>Historique des soldes</h2><p class="hint">Évolution entre deux relevés du compte.</p>'+h.map((v,i)=>{let j=data.history.findIndex(x=>x.id===v.id),diff=i?Number(v.balance)-Number(h[i-1].balance):null;return '<div class="row">'+field('Date',v.date,"historyChange("+j+",'date',this.value)",'date')+field('Solde €',v.balance,"historyChange("+j+",'balance',this.value)",'number')+'<b class="'+(diff<0?'negative':'positive')+'">'+(diff===null?'—':euro(diff))+'</b><button class="danger" onclick="data.history.splice('+j+',1);save()">Supprimer</button></div>'}).join('')+'<button class="btn" onclick="data.history.push({id:id(),date:new Date().toISOString().slice(0,10),balance:0});save()">+ Ajouter un relevé</button></section>'}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='numa-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
async function restore(el){try{let v=JSON.parse(await el.files[0].text());if(!Array.isArray(v.people)||!Array.isArray(v.expenses)||!Array.isArray(v.history))throw Error();data=v;save()}catch{alert('Sauvegarde non valide')}}
function render(){$('#app').innerHTML='<div class="top"><div class="wrap"><div class="logo">numa<i>.</i></div><span>Votre argent, en clair.</span></div></div>'+(data.configured?'<main class="wrap"><div class="eyebrow">MON ESPACE FINANCIER</div><h1>'+({home:'Vue générale',expenses:'Mes dépenses',history:'Historique',settings:'Paramètres'}[tab])+'</h1><p class="muted">Un budget flexible, des calculs instantanés.</p><nav class="tabs">'+[['home','Vue générale'],['expenses','Dépenses'],['history','Historique'],['settings','Paramètres']].map(([k,t])=>'<button class="'+(tab===k?'active':'')+'" onclick="tab=\''+k+'\';render()">'+t+'</button>').join('')+'</nav>'+({home,expenses,history,settings}[tab])()+'<p class="hint">Numa · Données locales · Aucun compte requis</p></main>':wizard())}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
